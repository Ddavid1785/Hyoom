[package]
name = "hyoom"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hyoom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6.0.0"
reqwest = { version = "0.12.24", features = ["json"] }
tokio = { version = "1.48.0", features = ["rt"] }
tauri-plugin-http = "2"
cpal = "0.16.0"
webrtc-vad = "0.4.0"
hound = "3.5.1"
dasp = { version = "0.11.0", features = ["signal", "interpolate", "interpolate-linear"] }
uuid = { version = "1.4", features = ["v4"] }
whisper-rs =  "0.15.1"
vosk = "0.3.1"
log = "0.4.29"
tauri-plugin-log = "2.7.1"

[profile.release]
lto = false           # Link Time Optimization: mashes C++ and Rust code together better
codegen-units = 1      # Slower build, but faster execution
panic = "abort"        # Removes stack unwinding (lighter binary)
strip = "debuginfo"
opt-level = 3          # Maximum optimization
